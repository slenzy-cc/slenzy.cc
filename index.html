<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slenzy Cyber Intelligence Platform</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #00ff66;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: var(--panel-bg);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .badge-free { background: #30363d; color: #fff; }
        .badge-premium { background: #d97706; color: #fff; }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .tab-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .search-box {
            background: var(--panel-bg);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            font-family: inherit;
        }

        .terminal-output {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            min-height: 200px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #58a6ff;
        }

        .lock-overlay {
            color: #f85149;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SLENZY // OSINT PLATFORM</h1>
        <div class="user-panel">
            <span id="user-status">Misafir</span>
            <span id="role-badge" class="badge badge-free">FREE</span>
            <button id="auth-btn" onclick="toggleAuth()">Google ile Giriş</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTool('ip')">IP Lookup</button>
        <button class="tab-btn" onclick="setTool('dns')">DNS Lookup</button>
        <button class="tab-btn" onclick="setTool('breach')">Email Breach [PREMIUM]</button>
    </div>

    <div class="search-box">
        <input type="text" id="target-input" placeholder="IP adresi girin (örn: 8.8.8.8)...">
        <button onclick="executeLookup()">Sorgula</button>
    </div>

    <div class="terminal-output" id="output">> Sistem hazır. Lütfen bir sorgu çalıştırın.</div>
</div>

<script>
    // 1. FIREBASE KONFİGÜRASYONU (Kendi Firebase bilgilerinizle değiştirin)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase Başlatma
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userRole = 'free'; // Varsayılan rol
    let currentTool = 'ip';

    // 2. KULLANICI OTURUM KONTROLÜ
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('user-status').innerText = user.displayName || user.email;
            document.getElementById('auth-btn').innerText = 'Çıkış Yap';

            // Veritabanından Kullanıcı Rolünü Çek
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                userRole = userDoc.data().role || 'free';
            } else {
                // Yeni Kullanıcı Kaydı
                await db.collection('users').doc(user.uid).set({
                    email: user.email,
                    role: 'free',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                userRole = 'free';
            }

            updateRoleUI();
        } else {
            currentUser = null;
            userRole = 'free';
            document.getElementById('user-status').innerText = 'Misafir';
            document.getElementById('auth-btn').innerText = 'Google ile Giriş';
            updateRoleUI();
        }
    });

    function updateRoleUI() {
        const badge = document.getElementById('role-badge');
        badge.innerText = userRole.toUpperCase();
        badge.className = `badge badge-${userRole}`;
    }

    // 3. GOOGLE ILE GIRIS / CIKIS
    function toggleAuth() {
        if (currentUser) {
            auth.signOut();
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                alert("Giriş Hatası: " + error.message);
            });
        }
    }

    // 4. ARAÇ SEÇİMİ VE INPUT TİPİ
    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const input = document.getElementById('target-input');
        if (tool === 'ip') input.placeholder = "IP adresi (örn: 8.8.8.8)...";
        if (tool === 'dns') input.placeholder = "Domain adresi (örn: example.com)...";
        if (tool === 'breach') input.placeholder = "E-posta adresi (örn: target@gmail.com)...";
    }

    // 5. SORGU ÇALIŞTIRMA MANTIĞI
    async function executeLookup() {
        const target = document.getElementById('target-input').value.trim();
        const output = document.getElementById('output');

        if (!target) {
            output.innerText = "> Hata: Lütfen geçerli bir hedef girin.";
            return;
        }

        // Yetki Kontrolü (Premium Modüller İçin)
        if (currentTool === 'breach' && userRole !== 'premium' && userRole !== 'admin') {
            output.innerHTML = `<span class="lock-overlay">[EŞİK ENGELİ] Bu araç sadece PREMIUM üyeler içindir.\nYükseltmek için yönetici ile iletişime geçin.</span>`;
            return;
        }

        output.innerText = `> ${currentTool.toUpperCase()} sorgusu başlatılıyor: ${target}...\n`;

        try {
            if (currentTool === 'ip') {
                const res = await fetch(`https://ipapi.co/${target}/json/`);
                const data = await res.json();
                output.innerText = JSON.stringify(data, null, 2);
            } 
            else if (currentTool === 'dns') {
                const res = await fetch(`https://dns.google/resolve?name=${target}`);
                const data = await res.json();
                output.innerText = JSON.stringify(data, null, 2);
            } 
            else if (currentTool === 'breach') {
                // Güvenli kamuya açık sızıntı API örneği
                const res = await fetch(`https://api.xposedornot.com/v1/check-email/${target}`);
                const data = await res.json();
                output.innerText = JSON.stringify(data, null, 2);
            }
        } catch (err) {
            output.innerText = `> Bağlantı hatası: ${err.message}`;
        }
    }
</script>

</body>
</html>
