<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLENZY // OSINT DASHBOARD v6.0 (ADMIN)</title>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #020617;
            --panel-bg: rgba(15, 23, 42, 0.95);
            --border: #1e293b;
            --sari: #fbc02d;
            --text: #f8fafc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover { background: #334155; }

        .btn-admin {
            background: #b91c1c;
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        pre {
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: #38bdf8;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        #admin-panel {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--sari);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>SLENZY // OSINT DASHBOARD</h2>
        <div>
            <button id="admin-panel-btn" class="btn btn-admin" onclick="adminPanelToggle()">🛠️ ADMİN PANELİ</button>
            <button id="auth-btn" class="btn" onclick="toggleAuth()">GİRİŞ YAP</button>
        </div>
    </header>

    <!-- ADMIN PANELİ -->
    <div id="admin-panel">
        <h3 style="color: var(--sari); margin-top: 0;">👥 Üye & Rol Yönetim Paneli</h3>
        <div id="user-list-container">Kullanıcı verileri yükleniyor...</div>
    </div>

    <!-- OSINT ARAÇLARI -->
    <div class="grid">
        <div class="card">
            <h3>🌐 Hızlı IP & Site Sorgu</h3>
            <input type="text" id="target-site" placeholder="Örn: google.com veya IP">
            <button class="btn" onclick="siteSorgula()">Sorgula</button>
            <pre id="res-site">Sonuç bekleniyor...</pre>
        </div>

        <div class="card">
            <h3>⚡ Hızlı Port Taraması</h3>
            <input type="text" id="target-port" placeholder="Örn: 8.8.8.8">
            <button class="btn" onclick="portSorgula()">Açık Portları Tara</button>
            <pre id="res-port">Sonuç bekleniyor...</pre>
        </div>

        <div class="card">
            <h3>📧 E-posta / Gmail Sorgu</h3>
            <input type="text" id="target-email" placeholder="Örn: ornek@gmail.com">
            <button class="btn" onclick="emailSorgula()">Sorgula</button>
            <pre id="res-email">Sonuç bekleniyor...</pre>
        </div>
    </div>
</div>

<script>
    // Gerçek Firebase Bilgilerin
    const firebaseConfig = {
        apiKey: "AIzaSyB-MaZC3_cPmBqytu5L4EMzmYGvxLFWBiK",
        authDomain: "slenzy-osint.firebaseapp.com",
        projectId: "slenzy-osint",
        storageBucket: "slenzy-osint.firebasestorage.app",
        messagingSenderId: "422738373532",
        appId: "1:422738373532:web:35f70c75a875917c413659",
        measurementId: "G-S39DH7GZZC"
    };

    const ADMIN_EMAIL = "mericegecan37@gmail.com";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        const authBtn = document.getElementById('auth-btn');
        const adminPanelBtn = document.getElementById('admin-panel-btn');

        if (user) {
            authBtn.innerText = 'ÇIKIŞ YAP';

            const userRef = db.collection('users').doc(user.uid);
            const doc = await userRef.get();

            if (!doc.exists) {
                await userRef.set({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || 'İsimsiz Kullanıcı',
                    photoURL: user.photoURL || '',
                    role: user.email === ADMIN_EMAIL ? 'admin' : 'user',
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                await userRef.update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            const userData = (await userRef.get()).data();
            if (userData?.role === 'admin' || user.email === ADMIN_EMAIL) {
                adminPanelBtn.style.display = 'inline-block';
                kullanicilariGetir();
            } else {
                adminPanelBtn.style.display = 'none';
            }
        } else {
            authBtn.innerText = 'GİRİŞ YAP';
            adminPanelBtn.style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
        }
    });

    function toggleAuth() {
        if (auth.currentUser) {
            auth.signOut().then(() => location.reload());
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Giriş Hatası: " + err.message));
        }
    }

    function adminPanelToggle() {
        const p = document.getElementById('admin-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    async function kullanicilariGetir() {
        const listContainer = document.getElementById('user-list-container');
        const snapshot = await db.collection('users').get();

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Kullanıcı</th>
                        <th>E-Posta</th>
                        <th>Rol</th>
                        <th>Rol Değiştir</th>
                    </tr>
                </thead>
                <tbody>
        `;

        snapshot.forEach(doc => {
            const u = doc.data();
            const badgeColor = u.role === 'admin' ? '#ef4444' : (u.role === 'vip' ? '#f59e0b' : '#3b82f6');
            
            html += `
                <tr>
                    <td style="display:flex; align-items:center; gap:8px;">
                        <img src="${u.photoURL || 'https://via.placeholder.com/28'}" style="width:28px; height:28px; border-radius:50%;">
                        ${u.displayName}
                    </td>
                    <td>${u.email}</td>
                    <td><span style="background:${badgeColor}; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold;">${(u.role || 'user').toUpperCase()}</span></td>
                    <td>
                        <select onchange="rolDegistir('${u.uid}', this.value)" style="background:#0f172a; color:#fff; border:1px solid #334155; padding:4px; border-radius:4px;">
                            <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                            <option value="vip" ${u.role === 'vip' ? 'selected' : ''}>VIP</option>
                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        listContainer.innerHTML = html;
    }

    async function rolDegistir(uid, yeniRol) {
        try {
            await db.collection('users').doc(uid).update({ role: yeniRol });
            alert("Rol başarıyla güncellendi!");
            kullanicilariGetir();
        } catch (err) {
            alert("Rol değiştirilemedi: " + err.message);
        }
    }

    async function siteSorgula() {
        const val = document.getElementById('target-site').value;
        const out = document.getElementById('res-site');
        if (!val) return alert("Lütfen bir domain veya IP girin!");

        out.innerText = "Sorgulanıyor...";
        try {
            const res = await fetch(`https://ipwhois.app/json/${val}`);
            const data = await res.json();
            if (!data.success) return out.innerText = "Sorgu başarısız: " + data.message;

            out.innerText = `IP: ${data.ip}\nÜlke: ${data.country}\nŞehir: ${data.city}\nISP: ${data.isp}\nOrganizasyon: ${data.org}`;
        } catch (e) {
            out.innerText = "Bağlantı hatası!";
        }
    }

    async function portSorgula() {
        const val = document.getElementById('target-port').value;
        const out = document.getElementById('res-port');
        if (!val) return alert("Lütfen bir IP adresi girin!");

        out.innerText = "Portlar taranıyor...";
        try {
            const res = await fetch(`https://api.hackertarget.com/nmap/?q=${val}`);
            const text = await res.text();
            out.innerText = text;
        } catch (e) {
            out.innerText = "Port tarama servisine ulaşılamadı!";
        }
    }

    async function emailSorgula() {
        const val = document.getElementById('target-email').value;
        const out = document.getElementById('res-email');
        if (!val) return alert("Lütfen bir e-posta girin!");

        out.innerText = "E-posta kontrol ediliyor...";
        try {
            const res = await fetch(`https://disposable.debounce.io/?email=${val}`);
            const data = await res.json();
            out.innerText = `E-Posta: ${val}\nGeçici E-posta Mı?: ${data.disposable === "true" ? "EVET" : "HAYIR"}`;
        } catch (e) {
            out.innerText = "E-posta sorgu servisine ulaşılamadı!";
        }
    }
</script>

</body>
</html>
