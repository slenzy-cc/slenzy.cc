<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLENZY // OSINT TERMINAL v3.0</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #030712;
            --card-bg: #0b0f19;
            --text: #00ff66;
            --text-dim: #009933;
            --accent: #00ff66;
            --border: #132a13;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--accent);
        }

        .btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 10px var(--accent);
        }

        .limit-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .limit-count {
            color: var(--accent);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }

        .tab-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
        }

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px var(--accent);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
        }

        .info-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-card strong {
            font-size: 1rem;
            color: var(--text);
            word-break: break-all;
        }

        .terminal-log {
            margin-top: 20px;
            background: #000;
            border: 1px solid var(--border);
            padding: 12px;
            font-size: 0.8rem;
            color: var(--text);
            min-height: 60px;
            white-space: pre-wrap;
        }

        .status-warning { color: var(--warning); }
        .status-danger { color: var(--danger); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">>_ SLENZY_OSINT</div>
        <div>
            <span id="user-display" style="font-size: 0.8rem; margin-right: 10px; color: var(--text-dim);">SYSTEM: GUEST</span>
            <button class="btn" onclick="toggleAuth()" id="auth-btn">LOGIN</button>
        </div>
    </header>

    <!-- Kalan Hak Göstergesi -->
    <div class="limit-box">
        <span>DAILY CREDITS REMAINING:</span>
        <span class="limit-count"><span id="credits-left">30</span> / 30</span>
    </div>

    <!-- Profesyonel Araç Sekmeleri -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTool('ip')">IP_INTEL</button>
        <button class="tab-btn" onclick="switchTool('shodan')">PORT_SCAN</button>
        <button class="tab-btn" onclick="switchTool('subdomain')">SUBDOMAINS</button>
        <button class="tab-btn" onclick="switchTool('mail')">BREACH_REPORT</button>
    </div>

    <div class="search-area">
        <input type="text" id="target-input" placeholder="[+] Enter Target IP (e.g., 8.8.8.8)">
        <button class="btn" onclick="executeSearch()">EXECUTE</button>
    </div>

    <div class="results-grid" id="results">
        <div class="info-card"><span id="lbl-1">TARGET_IP</span><strong id="res-1">-</strong></div>
        <div class="info-card"><span id="lbl-2">LOCATION</span><strong id="res-2">-</strong></div>
        <div class="info-card"><span id="lbl-3">ISP_ORG</span><strong id="res-3">-</strong></div>
        <div class="info-card"><span id="lbl-4">COORDINATES</span><strong id="res-4">-</strong></div>
    </div>

    <div class="terminal-log" id="status">> Terminal initialized. Awaiting user target...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let activeTool = 'ip';
    
    // Kredi Yönetimi (Sıfırlanmaya karşı LocalStorage Korumalı)
    function getRemainingCredits() {
        const today = new Date().toISOString().split('T')[0];
        const savedData = JSON.parse(localStorage.getItem('slenzy_credits') || '{}');
        
        if (savedData.date !== today) {
            const newData = { date: today, count: 30 };
            localStorage.setItem('slenzy_credits', JSON.stringify(newData));
            return 30;
        }
        return savedData.count;
    }

    function setRemainingCredits(count) {
        const today = new Date().toISOString().split('T')[0];
        localStorage.setItem('slenzy_credits', JSON.stringify({ date: today, count: count }));
        document.getElementById('credits-left').innerText = count;
    }

    document.getElementById('credits-left').innerText = getRemainingCredits();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-display').innerText = `USER: ${user.displayName || user.email}`;
            document.getElementById('auth-btn').innerText = 'LOGOUT';
        } else {
            document.getElementById('user-display').innerText = 'SYSTEM: GUEST';
            document.getElementById('auth-btn').innerText = 'LOGIN';
        }
    });

    function toggleAuth() {
        if (auth.currentUser) {
            auth.signOut();
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }
    }

    function switchTool(tool) {
        activeTool = tool;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        const input = document.getElementById('target-input');
        if(tool === 'ip') {
            input.placeholder = "[+] Enter Target IP (e.g., 8.8.8.8)";
            setLabels("TARGET_IP", "LOCATION", "ISP_ORGANIZATION", "GEO_COORDINATES");
        } else if(tool === 'shodan') {
            input.placeholder = "[+] Enter Target IP for Open Ports Scan";
            setLabels("TARGET_IP", "OPEN_PORTS", "HOSTNAMES", "SCAN_STATUS");
        } else if(tool === 'subdomain') {
            input.placeholder = "[+] Enter Domain (e.g., target.com)";
            setLabels("TARGET_DOMAIN", "FOUND_SUBDOMAINS", "MAP_TYPE", "ANALYSIS_STATUS");
        } else if(tool === 'mail') {
            input.placeholder = "[+] Enter Target Email (e.g., target@gmail.com)";
            setLabels("TARGET_EMAIL", "SECURITY_STATUS", "BREACH_COUNT", "EXPOSED_SOURCES");
        }
        resetResults();
    }

    function setLabels(l1, l2, l3, l4) {
        document.getElementById('lbl-1').innerText = l1;
        document.getElementById('lbl-2').innerText = l2;
        document.getElementById('lbl-3').innerText = l3;
        document.getElementById('lbl-4').innerText = l4;
    }

    function resetResults() {
        document.getElementById('res-1').innerText = '-';
        document.getElementById('res-2').innerText = '-';
        document.getElementById('res-3').innerText = '-';
        document.getElementById('res-4').innerText = '-';
    }

    async function executeSearch() {
        const query = document.getElementById('target-input').value.trim();
        const status = document.getElementById('status');
        let credits = getRemainingCredits();

        if (!query) {
            status.innerText = '[!] ERROR: Target parameter cannot be empty.';
            status.className = 'terminal-log status-warning';
            return;
        }

        if (credits <= 0) {
            status.innerText = '[!] ACCESS DENIED: Daily search quota reached (0/30). Upgrade to Premium for unlimited scans.';
            status.className = 'terminal-log status-danger';
            return;
        }

        status.innerText = `[+] Scanning target [${query}] across OSINT nodes...`;
        status.className = 'terminal-log';

        try {
            if(activeTool === 'ip') {
                if (query.startsWith('192.168.') || query.startsWith('10.') || query.startsWith('127.')) {
                    status.innerText = '[!] WARNING: Local/Private IPs cannot be routed over public OSINT.';
                    status.className = 'terminal-log status-warning';
                    return;
                }
                const res = await fetch(`https://ipapi.co/${query}/json/`);
                const data = await res.json();
                
                document.getElementById('res-1').innerText = data.ip || '-';
                document.getElementById('res-2').innerText = `${data.city || ''}, ${data.country_name || '-'}`;
                document.getElementById('res-3').innerText = data.org || '-';
                document.getElementById('res-4').innerText = `${data.latitude}, ${data.longitude}`;
                status.innerText = `[+] IP Location Intel fetched successfully.`;

            } else if(activeTool === 'shodan') {
                // Kamuya açık InternetDB Port Tarayıcısı
                const res = await fetch(`https://internetdb.shodan.io/${query}`);
                const data = await res.json();

                document.getElementById('res-1').innerText = query;
                document.getElementById('res-2').innerText = data.ports ? data.ports.join(', ') : 'No Open Ports';
                document.getElementById('res-3').innerText = data.hostnames ? data.hostnames.join(', ') : 'None';
                document.getElementById('res-4').innerText = 'SHODAN_NODE_ACTIVE';

                if(data.ports && data.ports.length > 0) {
                    status.innerText = `[!] CRITICAL: Target has ${data.ports.length} open internet ports: ${data.ports.join(', ')}`;
                } else {
                    status.innerText = `[+] Target ports secure. No open public service found.`;
                }

            } else if(activeTool === 'subdomain') {
                // CRT.sh ile Alt Domain/Subdomain Tespiti
                const cleanDomain = query.replace('https://', '').replace('http://', '').split('/')[0];
                const res = await fetch(`https://crt.sh/?q=%.${cleanDomain}&output=json`);
                const data = await res.json();

                const subdomains = [...new Set(data.map(item => item.name_value))].slice(0, 5);

                document.getElementById('res-1').innerText = cleanDomain;
                document.getElementById('res-2').innerText = subdomains.length > 0 ? `${subdomains.length} Subdomains Found` : 'None Found';
                document.getElementById('res-3').innerText = 'SSL Certificate Logs';
                document.getElementById('res-4').innerText = 'DEEP_MAP_COMPLETED';

                status.innerText = `[+] Subdomain Mapping Results:\n` + (subdomains.join('\n') || 'No subdomains detected.');

            } else if(activeTool === 'mail') {
                // Detaylı Veri Sızıntı Taraması
                const res = await fetch(`https://api.xposedornot.com/v1/check-email/${query}`);
                const data = await res.json();

                document.getElementById('res-1').innerText = query;
                if (data.Error) {
                    document.getElementById('res-2').innerText = 'SECURE (No Leaks)';
                    document.getElementById('res-3').innerText = '0 Breaches';
                    document.getElementById('res-4').innerText = 'PUBLIC_BREACH_DB';
                    status.innerText = '[+] Target email clear. No public breach records found.';
                } else {
                    const breachList = data.breaches && data.breaches[0] ? data.breaches[0].join(', ') : 'Detected';
                    document.getElementById('res-2').innerText = 'COMPROMISED';
                    document.getElementById('res-3').innerText = `${data.breaches ? data.breaches[0].length : '1+'} Leak(s)`;
                    document.getElementById('res-4').innerText = 'PUBLIC_BREACH_DB';
                    status.innerText = `[!] WARNING: Email leaked in data breaches!\n[+] Exposed Platforms: ${breachList}`;
                    status.className = 'terminal-log status-danger';
                }
            }

            credits--;
            setRemainingCredits(credits);

        } catch (err) {
            status.innerText = '[!] ERROR: Node fetch failed or rate-limited. Check target parameter.';
            status.className = 'terminal-log status-warning';
        }
    }
</script>

</body>
</html>
