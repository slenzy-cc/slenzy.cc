<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slenzy OSINT</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #0a0d12;
            --card-bg: #121820;
            --text: #e6edf3;
            --accent: #00ff66;
            --border: #1f2937;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
        }

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
        }

        .info-card span {
            display: block;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .info-card strong {
            font-size: 1.05rem;
            color: var(--text);
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">SLENZY // OSINT</div>
        <div>
            <span id="user-display" style="font-size: 0.85rem; margin-right: 10px;">Misafir</span>
            <button class="btn" onclick="toggleAuth()" id="auth-btn">Giriş Yap</button>
        </div>
    </header>

    <div class="search-area">
        <input type="text" id="target-ip" placeholder="IP Adresi girin (Örn: 8.8.8.8)">
        <button class="btn" onclick="lookupIP()">Sorgula</button>
    </div>

    <div class="results-grid" id="results">
        <div class="info-card"><span>IP Adresi</span><strong id="res-ip">-</strong></div>
        <div class="info-card"><span>Ülke / Şehir</span><strong id="res-location">-</strong></div>
        <div class="info-card"><span>İnternet Sağlayıcı (ISP)</span><strong id="res-isp">-</strong></div>
        <div class="info-card"><span>Koordinat</span><strong id="res-coords">-</strong></div>
    </div>

    <div class="status-bar" id="status">Sorgulama yapılması bekleniyor.</div>
</div>

<script>
    // Firebase Konfigürasyonun
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Oturum Durumu
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-display').innerText = user.displayName || user.email;
            document.getElementById('auth-btn').innerText = 'Çıkış';
        } else {
            document.getElementById('user-display').innerText = 'Misafir';
            document.getElementById('auth-btn').innerText = 'Giriş Yap';
        }
    });

    function toggleAuth() {
        if (auth.currentUser) {
            auth.signOut();
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }
    }

    // Basitleştirilmiş IP Sorgu
    async function lookupIP() {
        const ip = document.getElementById('target-ip').value.trim();
        const status = document.getElementById('status');

        if (!ip) {
            status.innerText = 'Lütfen geçerli bir IP girin.';
            return;
        }

        status.innerText = 'Veriler çekiliyor...';

        try {
            const res = await fetch(`https://ipapi.co/${ip}/json/`);
            const data = await res.json();

            if (data.error) {
                status.innerText = 'Hata: Geçersiz IP adresi.';
                return;
            }

            // Temiz Veri Basımı
            document.getElementById('res-ip').innerText = data.ip || '-';
            document.getElementById('res-location').innerText = `${data.city || ''}, ${data.country_name || '-'}`;
            document.getElementById('res-isp').innerText = data.org || '-';
            document.getElementById('res-coords').innerText = `${data.latitude}, ${data.longitude}`;

            status.innerText = 'Sorgulama başarılı!';
        } catch (err) {
            status.innerText = 'Veri alınırken hata oluştu.';
        }
    }
</script>

</body>
</html>
